# Visual do protótipo alinhado com a apresentação (mesma paleta e mesma fonte de títulos).
[server]
enableStaticServing = true

[theme]
base = "dark"
backgroundColor = "#121B26"
secondaryBackgroundColor = "#1A2532"
textColor = "#E9EDF1"
primaryColor = "#F0A93C"
linkColor = "#F5C77E"
borderColor = "#2C3A4A"
showWidgetBorder = true
baseRadius = "small"
headingFont = "Bricolage Grotesque, sans-serif"
font = "sans-serif"
chartCategoricalColors = ["#E2334A", "#F0A93C", "#B9C3CC", "#6FA3C7", "#8FBF8F"]

[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/fonts/BricolageGrotesque.woff2"
weight = "400 800"

[theme.sidebar]
backgroundColor = "#0E151E"
secondaryBackgroundColor = "#1A2532"
