AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Copiloto de Suporte (Challenge 002): uma EC2 ARM com Docker Compose e Caddy.
  Sem SSH (acesso por SSM Session Manager), IMDSv2 obrigatório, disco criptografado
  e papel IAM que só lê o parâmetro com a chave da API.

Parameters:
  Domain:
    Type: String
    Description: Domínio público, ex. suporte.seudominio.com (registro A no Cloudflare, proxy desligado)
  RepoUrl:
    Type: String
    Description: URL HTTPS do repositório Git com esta pasta
  RepoBranch:
    Type: String
    Default: main
  RepoSubdir:
    Type: String
    Default: "."
    Description: Subpasta do repositório onde estão compose.yaml e deploy/ (ex. submissions/seu-nome)
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.micro, t4g.small, t4g.medium]
  AnthropicKeyParameter:
    Type: String
    Default: /g4-support/anthropic-api-key
    Description: Parâmetro SSM (SecureString) com a chave, criado antes pelo dono da conta
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP e HTTPS publicos; sem SSH
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0" }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0" }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-api-key
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AnthropicKeyParameter}"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: g4-support-copilot }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker git
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-aarch64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          systemctl enable --now docker
          useradd --system --create-home --groups docker g4 || true
          echo 'g4 ALL=(root) NOPASSWD: /usr/bin/install' > /etc/sudoers.d/g4
          sudo -u g4 git clone --branch ${RepoBranch} ${RepoUrl} /home/g4/repo
          APP=/home/g4/repo/${RepoSubdir}
          sudo -u g4 cp $APP/.env.example $APP/.env
          sudo -u g4 sed -i "s|^DOMAIN=.*|DOMAIN=${Domain}|; s|^ANTHROPIC_KEY_PARAMETER=.*|ANTHROPIC_KEY_PARAMETER=${AnthropicKeyParameter}|" $APP/.env
          cat > /etc/systemd/system/g4-support.service <<EOF
          [Unit]
          Description=Copiloto de Suporte (docker compose)
          After=docker.service network-online.target
          Requires=docker.service
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          User=g4
          WorkingDirectory=$APP
          Environment=AWS_REGION=${AWS::Region}
          ExecStart=$APP/deploy/start.sh
          ExecStop=/usr/bin/docker compose down
          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable --now g4-support.service

  PublicIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance

Outputs:
  PublicIp:
    Description: Criar no Cloudflare um registro A de Domain para este IP (proxy desligado)
    Value: !Ref PublicIp
  Url:
    Value: !Sub "https://${Domain}"
  SessionManager:
    Description: Acesso ao servidor sem SSH
    Value: !Sub "aws ssm start-session --target ${Instance}"
